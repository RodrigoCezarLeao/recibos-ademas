<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recibos Ademas</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --border: #d9dce1;
    --text: #1f2430;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .home {
    width: 100%;
    max-width: 440px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
  }
  .lead {
    margin: 0 0 16px;
    color: var(--muted);
    font-size: 14px;
  }
  .tools {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .tool {
    display: flex;
    flex-direction: column;
    gap: 2px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    text-decoration: none;
    color: inherit;
  }
  .tool:hover {
    border-color: var(--accent);
    background: #f8faff;
  }
  .tool strong { font-size: 17px; }
  .tool span { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
  <main class="home">
    <h1>Recibos Ademas</h1>
    <p class="lead">Escolha o documento.</p>
    <nav class="tools">
      <a class="tool" href="./recibo.html">
        <strong>Recibo</strong>
        <span>Dois recibos de aluguel em uma folha A4.</span>
      </a>
      <a class="tool" href="./rescisao.html">
        <strong>Rescisão</strong>
        <span>Termo de rescisão do contrato de locação.</span>
      </a>
    </nav>
  </main>
</body>
</html>
