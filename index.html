<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Recibos de Aluguel</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --border: #d9dce1;
    --text: #1f2430;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .page-header {
    flex-shrink: 0;
    width: 100%;
    margin: 0 0 8px;
  }

  .tabs {
    display: flex;
    gap: 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 1px;
    background: #f7f8fa;
    color: var(--muted);
    border: none;
    border-radius: 0;
    border-bottom: 3px solid transparent;
    padding: 8px 14px;
    text-align: left;
    font-weight: 500;
  }
  .tab + .tab { border-left: 1px solid var(--border); }
  .tab:hover { background: #eef2ff; color: var(--text); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    border-bottom-color: var(--accent-dark);
  }
  .tab-title { font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .tab-pill {
    display: none;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    background: rgba(255,255,255,0.22);
    border-radius: 999px;
    padding: 2px 7px;
  }
  .tab.active .tab-pill { display: inline-block; }
  .tab-sub {
    font-size: 11px;
    font-weight: 400;
    color: var(--muted);
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tab.active .tab-sub { color: rgba(255,255,255,0.85); }

  .form-editing-banner {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #eff6ff;
    border: 1px solid #93c5fd;
    color: #1e40af;
    border-radius: 8px;
    padding: 7px 10px;
    margin-bottom: 10px;
    font-size: 14px;
    font-weight: 600;
  }
  .form-editing-banner .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  .layout {
    display: grid;
    grid-template-columns: 45fr 55fr;
    gap: 12px;
    width: 100%;
    margin: 0;
    align-items: stretch;
    flex: 1;
    min-height: 0;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    overflow-y: auto;
    min-height: 0;
  }
  fieldset {
    border: 1px solid var(--border);
    border-radius: 8px;
    margin: 0 0 8px;
    padding: 6px 10px 8px;
  }
  legend { font-weight: 600; font-size: 14px; color: var(--muted); padding: 0 4px; }
  label { display: block; font-size: 14px; margin: 5px 0 3px; color: var(--muted); }
  input[type=text], input[type=number], input[type=date], select {
    width: 100%;
    padding: 5px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 15px;
    background: #fff;
    color: var(--text);
  }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }
  .presets { display: flex; flex-direction: row; flex-wrap: wrap; gap: 6px; }
  .preset-option {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 6px; border: 1px solid var(--border); border-radius: 6px;
    cursor: pointer; font-size: 14px;
  }
  .preset-option:hover { border-color: var(--accent); }
  .preset-option input { width: auto; }
  .preset-save-field { margin-top: 6px; }
  .preset-actions { display: flex; gap: 6px; margin-top: 6px; }
  button {
    cursor: pointer;
    border: none;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 14px;
    font-weight: 500;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-secondary { background: #eef0f3; color: var(--text); }
  .btn-secondary:hover { background: #e2e5ea; }
  .btn-danger { background: #fde8e8; color: #b91c1c; }
  .btn-danger:hover { background: #fbd3d3; }
  .generate-bar { margin-top: 4px; }
  .generate-bar button { width: 100%; padding: 10px; font-size: 15px; }

  /* Preview: two receipts on one A4 sheet */
  #receiptPreview {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    height: 100%;
  }
  .sheet {
    background: #fff;
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
  }
  .receipt {
    background: #fff;
    border: 1px solid #111;
    padding: 16px 20px;
    font-family: Arial, Helvetica, sans-serif;
    color: #111;
    font-size: 13px;
    position: relative;
    cursor: pointer;
    opacity: 0.42;
    filter: grayscale(0.35);
    transition: opacity 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
  }
  .receipt:hover { opacity: 0.7; filter: grayscale(0.15); }
  .receipt.editing {
    opacity: 1;
    filter: none;
    cursor: default;
    outline: 3px solid var(--accent);
    outline-offset: 2px;
    box-shadow: 0 0 0 6px rgba(37, 99, 235, 0.16);
  }
  .receipt-badge {
    position: absolute;
    top: 8px;
    right: 10px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    background: #f3f4f6;
    border: 1px solid #e5e7eb;
    border-radius: 999px;
    padding: 2px 8px;
  }
  .receipt.editing .receipt-badge {
    color: #fff;
    background: var(--accent);
    border-color: var(--accent);
  }
  .receipt h2 { text-align: center; font-size: 17px; margin: 0 0 14px; letter-spacing: 0.5px; }
  .receipt table.items { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
  .receipt table.items td { padding: 3px 4px; }
  .receipt table.items td.label { width: 55%; }
  .receipt table.items td.value { text-align: right; font-variant-numeric: tabular-nums; }
  .receipt table.items tr.total td { border-top: 1.5px solid #111; font-weight: 700; padding-top: 6px; }
  .receipt .info-row { display: flex; margin-bottom: 5px; }
  .receipt .info-label { width: 190px; flex-shrink: 0; color: #333; }
  .receipt .info-value { flex: 1; border-bottom: 1px solid #999; padding-bottom: 2px; }
  .receipt .extenso { text-transform: uppercase; font-weight: 600; }
  .receipt .address-box {
    border: 1px solid #111; padding: 5px 10px; margin: 10px 0 6px; font-weight: 600;
  }
  .receipt .period-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .receipt .period-box { border: 1px solid #999; padding: 3px 10px; }
  .receipt .pix-box {
    border: 1px dashed #999; border-radius: 6px; padding: 8px 10px; margin: 0 0 10px;
    font-size: 12px; background: #fafafa; line-height: 1.5;
  }
  .receipt .signature { margin-top: 24px; text-align: center; }
  .receipt .signature .line { border-top: 1px solid #111; width: 260px; margin: 0 auto 4px; }

  .cut-line {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #9ca3af;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    user-select: none;
    padding: 0 12px;
    margin: 8px 0;
  }
  .cut-line::before,
  .cut-line::after {
    content: "";
    flex: 1;
    border-top: 1px dashed #bbb;
  }

  @media (max-width: 860px) {
    body { overflow: auto; }
    .layout { grid-template-columns: 1fr; }
  }

  @page {
    size: A4 portrait;
    margin: 16mm 10mm 10mm 10mm;
  }

  @media print {
    * {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    body { padding: 0; margin: 0; overflow: visible; height: auto; background: #fff; }
    .page-header, .layout > .card:first-child { display: none !important; }
    .layout { display: block; height: auto; max-width: none; }
    .layout > .card:last-child { border: none; padding: 0; overflow: visible; height: auto; }
    #receiptPreview { padding: 0; height: auto; display: block; }
    .sheet {
      border: none;
      max-width: none;
      width: 100%;
      height: 271mm; /* A4 297mm − 16mm topo − 10mm base */
      display: flex;
      flex-direction: column;
    }
    .receipt {
      flex: 1 1 0;
      overflow: visible;
      padding: 6mm 8mm;
      border: 0.4mm solid #000 !important;
      outline: none !important;
      box-shadow: none !important;
      background: #fff;
      opacity: 1 !important;
      filter: none !important;
      cursor: default;
    }
    .receipt-badge { display: none; }
    .cut-line {
      flex: 0 0 auto;
      margin: 3.5mm 0;
      padding: 0;
      color: #666;
      font-size: 8px;
    }
    .cut-line::before,
    .cut-line::after { border-top: 0.3mm dashed #666; }
  }
</style>
</head>
<body>

<div class="page-header">
  <div class="tabs" id="receiptTabs" role="tablist">
    <button type="button" class="tab active" data-index="0" role="tab" aria-selected="true">
      <span class="tab-title">Recibo 1 <span class="tab-pill">editando</span></span>
      <span class="tab-sub" id="tabSub0">Sem nome</span>
    </button>
    <button type="button" class="tab" data-index="1" role="tab" aria-selected="false">
      <span class="tab-title">Recibo 2 <span class="tab-pill">editando</span></span>
      <span class="tab-sub" id="tabSub1">Sem nome</span>
    </button>
  </div>
</div>

<div class="layout">
  <!-- FORM -->
  <div class="card">
    <div class="form-editing-banner" id="formEditingBanner">
      <span class="dot"></span>
      <span id="formEditingLabel">Editando Recibo 1</span>
    </div>
    <div class="row" style="margin-bottom:8px;">
      <fieldset style="flex:1;margin-bottom:0;">
        <legend>Imóvel (endereço salvo)</legend>
        <div class="presets" id="propertyPresets"></div>
        <div class="preset-actions">
          <button type="button" class="btn-secondary" id="saveProperty">Salvar</button>
          <button type="button" class="btn-danger" id="deleteProperty">Remover</button>
        </div>
      </fieldset>

      <fieldset style="flex:1;margin-bottom:0;">
        <legend>Inquilino (nome salvo)</legend>
        <div class="presets" id="tenantPresets"></div>
        <div class="preset-save-field">
          <label for="newTenantName">Novo inquilino</label>
          <input type="text" id="newTenantName" placeholder="Digite o nome para salvar">
        </div>
        <div class="preset-actions">
          <button type="button" class="btn-secondary" id="saveTenant">Salvar</button>
          <button type="button" class="btn-danger" id="deleteTenant">Remover</button>
        </div>
      </fieldset>
    </div>

    <fieldset>
      <legend>Dados do recibo</legend>
      <div class="row">
        <div style="flex:1;">
          <label>Recebi de</label>
          <input type="text" id="tenantName">
        </div>
        <div style="flex:1.4;">
          <label>Endereço do imóvel</label>
          <input type="text" id="address">
        </div>
      </div>

      <div class="row">
        <div>
          <label>Imóvel n°</label>
          <input type="text" id="propertyNumber">
        </div>
        <div>
          <label>Proveniente do aluguel de</label>
          <input type="text" id="rentPeriodLabel">
        </div>
      </div>

      <div class="row">
        <div>
          <label>Aluguel (R$)</label>
          <input type="number" step="0.01" id="valAluguel">
        </div>
        <div>
          <label>Luz sv. (R$)</label>
          <input type="number" step="0.01" id="valLuz">
        </div>
        <div>
          <label>Água (R$)</label>
          <input type="number" step="0.01" id="valAgua">
        </div>
      </div>
      <div class="row">
        <div>
          <label>Iptu (R$)</label>
          <input type="number" step="0.01" id="valIptu">
        </div>
        <div>
          <label>Multa (R$)</label>
          <input type="number" step="0.01" id="valMulta">
        </div>
        <div>
          <label>Total</label>
          <input type="text" id="totalDisplay" readonly style="font-weight:600;background:#f7f8fa;">
        </div>
      </div>

      <div class="row" style="margin-top:6px;">
        <div>
          <label>Período de</label>
          <input type="date" id="periodFrom">
        </div>
        <div>
          <label>a</label>
          <input type="date" id="periodTo">
        </div>
        <div>
          <label>Vence em</label>
          <input type="date" id="dueDate">
        </div>
      </div>

      <label class="preset-option" style="margin-top:8px;width:fit-content;">
        <input type="checkbox" id="showPix">
        <span>Incluir informação de pagamento via PIX</span>
      </label>
    </fieldset>

    <div class="generate-bar">
      <button type="button" class="btn-primary" id="generateBtn">Imprimir os 2 recibos (1 folha A4)</button>
    </div>
  </div>

  <!-- PREVIEW -->
  <div class="card">
    <div id="receiptPreview"><p style="color:#9ca3af;font-size:13px;">A pré-visualização dos recibos aparecerá aqui.</p></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var STORAGE_PROPERTIES = "recibos_properties_v1";
  var STORAGE_TENANTS = "recibos_tenants_v1";
  var STORAGE_DRAFTS = "recibos_drafts_v1";

  var FIELD_IDS = [
    "tenantName", "address", "propertyNumber", "rentPeriodLabel",
    "valAluguel", "valLuz", "valAgua", "valIptu", "valMulta",
    "periodFrom", "periodTo", "dueDate"
  ];

  var DEFAULT_PROPERTIES = [
    {
      id: "irma-filomena",
      label: "Rua Irmã Filomena 31 - Mesquita",
      address: "Rua Irmã Filomena 31 Mesquita",
      propertyNumber: "2",
      aluguel: 600.00,
      luz: 4.90,
      agua: 16.25,
      iptu: 22.65
    },
    {
      id: "avenida-uniao",
      label: "Avenida União, n° 297 - Mesquita",
      address: "Avenida União, n° 297 - Mesquita",
      propertyNumber: "297",
      aluguel: 700.00,
      luz: 20.61,
      agua: 64.88,
      iptu: 22.29
    }
  ];

  var DEFAULT_TENANTS = [
    { id: "casa-31-maria-gorete", label: "Maria Gorete Da Silva", propertyNumber: "31", propertyId: "irma-filomena" },
    { id: "casa-2-gloria-pereira", label: "Gloria Pereira da Silva Pereira", propertyNumber: "2", propertyId: "irma-filomena" },
    { id: "casa-3-regina-pereira", label: "Regina Pereira de Lima Oliveira", propertyNumber: "3", propertyId: "irma-filomena" },
    { id: "casa-4-fabiana-regina", label: "Fabiana Regina Penha da Silva Santos", propertyNumber: "4", propertyId: "irma-filomena" },
    { id: "casa-5-tatiane-gomes", label: "Tatiane Gomes do Nascimento", propertyNumber: "5", propertyId: "irma-filomena" },
    { id: "casa-6-tatiane-santos", label: "Tatiane Dos Santos Leal", propertyNumber: "6", propertyId: "irma-filomena" }
  ];

  function loadList(key, defaults) {
    var raw = localStorage.getItem(key);
    if (!raw) return defaults.slice();
    try {
      var parsed = JSON.parse(raw);
      if (Array.isArray(parsed) && parsed.length) return parsed;
      return defaults.slice();
    } catch (e) {
      return defaults.slice();
    }
  }

  function saveList(key, list) {
    localStorage.setItem(key, JSON.stringify(list));
  }

  function sameText(a, b) {
    return (a || "").trim().toLowerCase() === (b || "").trim().toLowerCase();
  }

  function tenantDisplayName(tenant) {
    var name = tenant.label || "";
    return tenant.propertyNumber ? name + " (Casa " + tenant.propertyNumber + ")" : name;
  }

  function syncDefaultTenants() {
    var changed = false;
    var legacyDefaults = [
      { id: "gloria", label: "Gloria Pereira da Silva Silveira" },
      { id: "mauricio", label: "Mauricio Guilherme Reis dos Santos" }
    ];

    legacyDefaults.forEach(function (legacy) {
      var before = tenants.length;
      tenants = tenants.filter(function (tenant) {
        return !(tenant.id === legacy.id && sameText(tenant.label, legacy.label));
      });
      if (tenants.length !== before) changed = true;
    });

    DEFAULT_TENANTS.forEach(function (defaultTenant) {
      var existing = tenants.find(function (tenant) {
        return tenant.id === defaultTenant.id || sameText(tenant.label, defaultTenant.label);
      });
      if (existing) {
        if (
          existing.id !== defaultTenant.id ||
          existing.label !== defaultTenant.label ||
          existing.propertyNumber !== defaultTenant.propertyNumber ||
          existing.propertyId !== defaultTenant.propertyId
        ) {
          existing.id = defaultTenant.id;
          existing.label = defaultTenant.label;
          existing.propertyNumber = defaultTenant.propertyNumber;
          existing.propertyId = defaultTenant.propertyId;
          changed = true;
        }
        return;
      }
      tenants.push({
        id: defaultTenant.id,
        label: defaultTenant.label,
        propertyNumber: defaultTenant.propertyNumber,
        propertyId: defaultTenant.propertyId
      });
      changed = true;
    });

    if (changed) saveList(STORAGE_TENANTS, tenants);
  }

  var properties = loadList(STORAGE_PROPERTIES, DEFAULT_PROPERTIES);
  var tenants = loadList(STORAGE_TENANTS, DEFAULT_TENANTS);
  syncDefaultTenants();

  function emptyReceipt() {
    return {
      tenantName: "",
      address: "",
      propertyNumber: "",
      rentPeriodLabel: "01 Mês",
      valAluguel: "",
      valLuz: "",
      valAgua: "",
      valIptu: "",
      valMulta: "",
      periodFrom: "",
      periodTo: "",
      dueDate: "",
      showPix: false,
      selectedPropertyId: null,
      selectedTenantId: null
    };
  }

  function receiptFromDefaults(tenant, property) {
    var data = emptyReceipt();
    if (property) {
      data.selectedPropertyId = property.id || null;
      data.address = property.address;
      data.propertyNumber = property.propertyNumber;
      data.valAluguel = property.aluguel;
      data.valLuz = property.luz;
      data.valAgua = property.agua;
      data.valIptu = property.iptu;
    }
    if (tenant) {
      data.tenantName = tenant.label || "";
      data.selectedTenantId = tenant.id || null;
      if (tenant.propertyNumber) data.propertyNumber = tenant.propertyNumber;
      if (tenant.propertyId) data.selectedPropertyId = tenant.propertyId;
    }
    return data;
  }

  function loadDrafts() {
    try {
      var raw = localStorage.getItem(STORAGE_DRAFTS);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      if (Array.isArray(parsed) && parsed.length === 2) return parsed;
    } catch (e) {}
    return null;
  }

  function saveDrafts() {
    localStorage.setItem(STORAGE_DRAFTS, JSON.stringify(receipts));
  }

  var receipts = loadDrafts() || [
    receiptFromDefaults(tenants[0], properties[0]),
    receiptFromDefaults(tenants[1] || tenants[0], properties[1] || properties[0])
  ];
  var activeIndex = 0;

  var $ = function (id) { return document.getElementById(id); };

  function fmtMoney(n) {
    return "R$ " + (n || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function fmtDateBR(isoStr) {
    if (!isoStr) return "";
    var parts = isoStr.split("-");
    if (parts.length !== 3) return isoStr;
    return parts[2] + "/" + parts[1] + "/" + parts[0];
  }

  // ---- Number to words (Portuguese, currency) ----
  var UNIDADES = ["", "um", "dois", "três", "quatro", "cinco", "seis", "sete", "oito", "nove"];
  var DEZ_A_DEZENOVE = ["dez", "onze", "doze", "treze", "quatorze", "quinze", "dezesseis", "dezessete", "dezoito", "dezenove"];
  var DEZENAS = ["", "", "vinte", "trinta", "quarenta", "cinquenta", "sessenta", "setenta", "oitenta", "noventa"];
  var CENTENAS = ["", "cento", "duzentos", "trezentos", "quatrocentos", "quinhentos", "seiscentos", "setecentos", "oitocentos", "novecentos"];

  function trioToWords(n) {
    if (n === 0) return "";
    if (n === 100) return "cem";
    var c = Math.floor(n / 100);
    var r = n % 100;
    var parts = [];
    if (c > 0) parts.push(CENTENAS[c]);
    if (r > 0) {
      if (r < 10) parts.push(UNIDADES[r]);
      else if (r < 20) parts.push(DEZ_A_DEZENOVE[r - 10]);
      else {
        var d = Math.floor(r / 10);
        var u = r % 10;
        parts.push(DEZENAS[d] + (u > 0 ? " e " + UNIDADES[u] : ""));
      }
    }
    return parts.join(" e ");
  }

  function integerToWords(num) {
    if (num === 0) return "zero";
    var scales = [
      { value: 1000000000, singular: "bilhão", plural: "bilhões" },
      { value: 1000000, singular: "milhão", plural: "milhões" },
      { value: 1000, singular: "mil", plural: "mil" },
      { value: 1, singular: "", plural: "" }
    ];
    var remaining = num;
    var segments = [];
    for (var i = 0; i < scales.length; i++) {
      var scale = scales[i];
      var count = Math.floor(remaining / scale.value);
      remaining = remaining % scale.value;
      if (count > 0) {
        if (scale.value === 1000 && count === 1) {
          segments.push("mil");
        } else if (scale.value === 1) {
          segments.push(trioToWords(count));
        } else {
          segments.push(trioToWords(count) + " " + (count === 1 ? scale.singular : scale.plural));
        }
      }
    }
    if (segments.length === 1) return segments[0];
    var last = segments[segments.length - 1];
    var head = segments.slice(0, -1).join(", ");
    return head + " e " + last;
  }

  function valorPorExtenso(value) {
    var cents = Math.round(value * 100);
    var reais = Math.floor(cents / 100);
    var centavos = cents % 100;
    var reaisWords = reais > 0
      ? integerToWords(reais) + (reais === 1 ? " real" : " reais")
      : "";
    var centavosWords = centavos > 0
      ? integerToWords(centavos) + (centavos === 1 ? " centavo" : " centavos")
      : "";
    if (reaisWords && centavosWords) return (reaisWords + " e " + centavosWords).toUpperCase();
    if (reaisWords) return reaisWords.toUpperCase();
    if (centavosWords) return centavosWords.toUpperCase();
    return "ZERO REAIS";
  }

  // ---- Form state (per-receipt) ----
  function collectFormData() {
    var data = emptyReceipt();
    FIELD_IDS.forEach(function (id) {
      data[id] = $(id).value;
    });
    data.showPix = $("showPix").checked;
    data.selectedPropertyId = receipts[activeIndex].selectedPropertyId;
    data.selectedTenantId = receipts[activeIndex].selectedTenantId;
    return data;
  }

  function applyFormData(data) {
    FIELD_IDS.forEach(function (id) {
      $(id).value = data[id] != null ? data[id] : "";
    });
    $("showPix").checked = !!data.showPix;
    renderPropertyPresets();
    renderTenantPresets();
    updateTotal();
  }

  function syncCurrent() {
    receipts[activeIndex] = collectFormData();
    saveDrafts();
    updateTabLabels();
  }

  function switchReceipt(index) {
    if (index === activeIndex) return;
    syncCurrent();
    activeIndex = index;
    applyFormData(receipts[activeIndex]);
    updateTabUI();
    renderPreview();
  }

  function updateTabLabels() {
    for (var i = 0; i < 2; i++) {
      var name = (receipts[i].tenantName || "").trim();
      $("tabSub" + i).textContent = name || "Sem nome";
    }
    var activeName = (receipts[activeIndex].tenantName || "").trim();
    $("formEditingLabel").textContent = activeName
      ? "Editando Recibo " + (activeIndex + 1) + " — " + activeName
      : "Editando Recibo " + (activeIndex + 1);
  }

  function updateTabUI() {
    var buttons = document.querySelectorAll(".tab");
    for (var i = 0; i < buttons.length; i++) {
      var isActive = Number(buttons[i].getAttribute("data-index")) === activeIndex;
      buttons[i].classList.toggle("active", isActive);
      buttons[i].setAttribute("aria-selected", isActive ? "true" : "false");
    }
    updateTabLabels();
  }

  document.getElementById("receiptTabs").addEventListener("click", function (e) {
    var btn = e.target.closest(".tab");
    if (!btn) return;
    switchReceipt(Number(btn.getAttribute("data-index")));
  });

  $("receiptPreview").addEventListener("click", function (e) {
    var receipt = e.target.closest(".receipt");
    if (!receipt) return;
    var index = Number(receipt.getAttribute("data-index"));
    if (!isNaN(index)) switchReceipt(index);
  });

  // ---- Rendering preset lists ----
  function renderPropertyPresets() {
    var container = $("propertyPresets");
    container.innerHTML = "";
    var selectedId = receipts[activeIndex].selectedPropertyId;
    properties.forEach(function (p) {
      var wrap = document.createElement("label");
      wrap.className = "preset-option";
      var radio = document.createElement("input");
      radio.type = "radio";
      radio.name = "propertyPreset";
      radio.value = p.id;
      radio.checked = p.id === selectedId;
      radio.addEventListener("change", function () {
        receipts[activeIndex].selectedPropertyId = p.id;
        applyProperty(p);
      });
      var span = document.createElement("span");
      span.textContent = p.label;
      wrap.appendChild(radio);
      wrap.appendChild(span);
      container.appendChild(wrap);
    });
  }

  function renderTenantPresets() {
    var container = $("tenantPresets");
    container.innerHTML = "";
    var selectedId = receipts[activeIndex].selectedTenantId;
    tenants.forEach(function (t) {
      var wrap = document.createElement("label");
      wrap.className = "preset-option";
      var radio = document.createElement("input");
      radio.type = "radio";
      radio.name = "tenantPreset";
      radio.value = t.id;
      radio.checked = t.id === selectedId;
      radio.addEventListener("change", function () {
        receipts[activeIndex].selectedTenantId = t.id;
        applyTenant(t);
      });
      var span = document.createElement("span");
      span.textContent = tenantDisplayName(t);
      wrap.appendChild(radio);
      wrap.appendChild(span);
      container.appendChild(wrap);
    });
  }

  function applyProperty(p) {
    $("address").value = p.address;
    $("propertyNumber").value = p.propertyNumber;
    $("valAluguel").value = p.aluguel;
    $("valLuz").value = p.luz;
    $("valAgua").value = p.agua;
    $("valIptu").value = p.iptu;
    onFormChange();
  }

  function applyTenant(t) {
    if (t.propertyId) {
      var property = properties.find(function (p) { return p.id === t.propertyId; });
      if (property) {
        receipts[activeIndex].selectedPropertyId = property.id;
        $("address").value = property.address;
        $("propertyNumber").value = property.propertyNumber;
        $("valAluguel").value = property.aluguel;
        $("valLuz").value = property.luz;
        $("valAgua").value = property.agua;
        $("valIptu").value = property.iptu;
        renderPropertyPresets();
      }
    }
    $("tenantName").value = t.label;
    if (t.propertyNumber) $("propertyNumber").value = t.propertyNumber;
    onFormChange();
  }

  function updateTotal() {
    var total = getTotal(collectFormData());
    $("totalDisplay").value = fmtMoney(total);
    return total;
  }

  function getTotal(data) {
    var aluguel = parseFloat(data.valAluguel) || 0;
    var luz = parseFloat(data.valLuz) || 0;
    var agua = parseFloat(data.valAgua) || 0;
    var iptu = parseFloat(data.valIptu) || 0;
    var multa = parseFloat(data.valMulta) || 0;
    return aluguel + luz + agua + iptu + multa;
  }

  function onFormChange() {
    syncCurrent();
    updateTotal();
    renderPreview();
  }

  function renderPreview() {
    updateTotal();
    $("receiptPreview").innerHTML =
      '<div class="sheet">' +
        buildReceiptHTML(receipts[0], 0) +
        '<div class="cut-line">cortar</div>' +
        buildReceiptHTML(receipts[1], 1) +
      "</div>";
  }

  FIELD_IDS.forEach(function (id) {
    $(id).addEventListener("input", onFormChange);
  });
  $("showPix").addEventListener("change", onFormChange);

  // ---- Save / delete presets ----
  function slugify(str) {
    return str.toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/(^-|-$)/g, "") + "-" + Date.now();
  }

  $("saveProperty").addEventListener("click", function () {
    var address = $("address").value.trim();
    if (!address) { alert("Preencha o endereço antes de salvar."); return; }
    var id = slugify(address);
    var p = {
      id: id,
      label: address,
      address: address,
      propertyNumber: $("propertyNumber").value.trim(),
      aluguel: parseFloat($("valAluguel").value) || 0,
      luz: parseFloat($("valLuz").value) || 0,
      agua: parseFloat($("valAgua").value) || 0,
      iptu: parseFloat($("valIptu").value) || 0
    };
    properties.push(p);
    saveList(STORAGE_PROPERTIES, properties);
    receipts[activeIndex].selectedPropertyId = id;
    renderPropertyPresets();
  });

  $("deleteProperty").addEventListener("click", function () {
    var selectedId = receipts[activeIndex].selectedPropertyId;
    if (!selectedId) return;
    if (!confirm("Remover o imóvel selecionado da lista salva?")) return;
    properties = properties.filter(function (p) { return p.id !== selectedId; });
    saveList(STORAGE_PROPERTIES, properties);
    receipts[activeIndex].selectedPropertyId = properties.length ? properties[0].id : null;
    renderPropertyPresets();
    if (receipts[activeIndex].selectedPropertyId) applyProperty(properties[0]);
  });

  $("saveTenant").addEventListener("click", function () {
    var name = $("newTenantName").value.trim() || $("tenantName").value.trim();
    if (!name) { alert("Preencha o nome antes de salvar."); return; }
    var existing = tenants.find(function (t) {
      return (t.label || "").trim().toLowerCase() === name.toLowerCase();
    });
    if (existing) {
      $("newTenantName").value = "";
      receipts[activeIndex].selectedTenantId = existing.id;
      applyTenant(existing);
      renderTenantPresets();
      return;
    }
    var id = slugify(name);
    tenants.push({
      id: id,
      label: name,
      propertyNumber: $("propertyNumber").value.trim(),
      propertyId: receipts[activeIndex].selectedPropertyId
    });
    saveList(STORAGE_TENANTS, tenants);
    receipts[activeIndex].selectedTenantId = id;
    $("tenantName").value = name;
    $("newTenantName").value = "";
    renderTenantPresets();
    onFormChange();
  });

  $("deleteTenant").addEventListener("click", function () {
    var selectedId = receipts[activeIndex].selectedTenantId;
    if (!selectedId) return;
    if (!confirm("Remover o nome selecionado da lista salva?")) return;
    tenants = tenants.filter(function (t) { return t.id !== selectedId; });
    saveList(STORAGE_TENANTS, tenants);
    receipts[activeIndex].selectedTenantId = tenants.length ? tenants[0].id : null;
    renderTenantPresets();
    if (receipts[activeIndex].selectedTenantId) applyTenant(tenants[0]);
  });

  // ---- Generate receipt ----
  function buildReceiptHTML(data, index) {
    var total = getTotal(data);
    var extenso = valorPorExtenso(total);
    var tenantName = (data.tenantName || "").trim() || "-";
    var address = (data.address || "").trim() || "-";
    var propertyNumber = (data.propertyNumber || "").trim() || "-";
    var rentPeriodLabel = (data.rentPeriodLabel || "").trim() || "01 Mês";
    var periodFrom = fmtDateBR(data.periodFrom);
    var periodTo = fmtDateBR(data.periodTo);
    var dueDate = fmtDateBR(data.dueDate);

    var aluguel = parseFloat(data.valAluguel) || 0;
    var luz = parseFloat(data.valLuz) || 0;
    var agua = parseFloat(data.valAgua) || 0;
    var iptu = parseFloat(data.valIptu) || 0;
    var multa = parseFloat(data.valMulta) || 0;
    var pixHTML = data.showPix
      ? '<div class="pix-box">' +
          '<strong>Pagamento via PIX</strong><br>' +
          'Chave (CPF): 111.517.147-04 &nbsp;&bull;&nbsp; Banco Itaú' +
        '</div>'
      : '';

    var editingClass = index === activeIndex ? " editing" : "";
    var inner = buildReceiptInnerHTML({
      tenantName: tenantName,
      address: address,
      propertyNumber: propertyNumber,
      rentPeriodLabel: rentPeriodLabel,
      periodFrom: periodFrom,
      periodTo: periodTo,
      dueDate: dueDate,
      aluguel: aluguel,
      luz: luz,
      agua: agua,
      iptu: iptu,
      multa: multa,
      total: total,
      extenso: extenso,
      pixHTML: pixHTML
    });

    return '' +
    '<div class="receipt' + editingClass + '" data-index="' + index + '">' +
      '<span class="receipt-badge">' + (index === activeIndex ? "Editando recibo " : "Recibo ") + (index + 1) + '</span>' +
      inner +
    '</div>';
  }

  function buildReceiptInnerHTML(d) {
    return '' +
      '<h2>RECIBO DE ALUGUEL</h2>' +
      d.pixHTML +
      '<table class="items">' +
        '<tr><td class="label">Aluguel</td><td class="value">' + fmtMoney(d.aluguel) + '</td></tr>' +
        '<tr><td class="label">Luz sv.</td><td class="value">' + fmtMoney(d.luz) + '</td></tr>' +
        '<tr><td class="label">Água</td><td class="value">' + fmtMoney(d.agua) + '</td></tr>' +
        '<tr><td class="label">Iptu</td><td class="value">' + fmtMoney(d.iptu) + '</td></tr>' +
        '<tr><td class="label">Multa</td><td class="value">' + (d.multa > 0 ? fmtMoney(d.multa) : "") + '</td></tr>' +
        '<tr class="total"><td class="label">Total</td><td class="value">' + fmtMoney(d.total) + '</td></tr>' +
      '</table>' +
      '<div class="info-row"><div class="info-label">Recebi de</div><div class="info-value">' + d.tenantName + '</div></div>' +
      '<div class="info-row"><div class="info-label">A quantia de</div><div class="info-value extenso">' + d.extenso + '</div></div>' +
      '<div class="info-row"><div class="info-label">Proveniente do aluguel de</div><div class="info-value">' + d.rentPeriodLabel + '</div></div>' +
      '<div class="info-row"><div class="info-label">Do imóvel n°</div><div class="info-value">' + d.propertyNumber + '</div></div>' +
      '<div class="address-box">' + d.address + '</div>' +
      '<div class="period-row">' +
        '<span>Correspondente ao período de</span>' +
        '<span class="period-box">' + (d.periodFrom || "&nbsp;&nbsp;&nbsp;&nbsp;") + '</span>' +
        '<span>a</span>' +
        '<span class="period-box">' + (d.periodTo || "&nbsp;&nbsp;&nbsp;&nbsp;") + '</span>' +
      '</div>' +
      '<div class="period-row">' +
        '<span>À vencer em</span>' +
        '<span class="period-box">' + (d.dueDate || "&nbsp;&nbsp;&nbsp;&nbsp;") + '</span>' +
      '</div>' +
      '<div class="signature">' +
        '<div class="line"></div>' +
        '<div>Assinatura</div>' +
      '</div>';
  }

  function framedReceiptHTML(data) {
    var total = getTotal(data);
    var pixHTML = data.showPix
      ? '<div class="pix-box"><strong>Pagamento via PIX</strong><br>Chave (CPF): 111.517.147-04 &nbsp;&bull;&nbsp; Banco Itaú</div>'
      : "";
    var inner = buildReceiptInnerHTML({
      tenantName: (data.tenantName || "").trim() || "-",
      address: (data.address || "").trim() || "-",
      propertyNumber: (data.propertyNumber || "").trim() || "-",
      rentPeriodLabel: (data.rentPeriodLabel || "").trim() || "01 Mês",
      periodFrom: fmtDateBR(data.periodFrom),
      periodTo: fmtDateBR(data.periodTo),
      dueDate: fmtDateBR(data.dueDate),
      aluguel: parseFloat(data.valAluguel) || 0,
      luz: parseFloat(data.valLuz) || 0,
      agua: parseFloat(data.valAgua) || 0,
      iptu: parseFloat(data.valIptu) || 0,
      multa: parseFloat(data.valMulta) || 0,
      total: total,
      extenso: valorPorExtenso(total),
      pixHTML: pixHTML
    });
    return '' +
      '<div class="frame">' +
        '<div class="edge edge-t"></div>' +
        '<div class="edge edge-r"></div>' +
        '<div class="edge edge-b"></div>' +
        '<div class="edge edge-l"></div>' +
        '<div class="frame-inner">' + inner + '</div>' +
      '</div>';
  }

  var PRINT_CSS = '' +
    '@page { size: A4 portrait; margin: 28mm 18mm 16mm 18mm; }' +
    '* { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }' +
    'html, body { margin: 0; padding: 0; background: #fff; color: #000; }' +
    'body { font-family: Arial, Helvetica, sans-serif; font-size: 11pt; padding-top: 12mm; }' +
    'h2 { text-align: center; font-size: 14pt; margin: 0 0 8pt; letter-spacing: 0.5px; }' +
    '.sheet { width: 158mm; margin: 0 auto; }' +
    '.frame { position: relative; width: 100%; page-break-inside: avoid; }' +
    '.frame-inner { padding: 5mm 7mm 7mm; }' +
    '.edge { position: absolute; }' +
    '.edge-t { top: 0; left: 0; right: 0; height: 0; border-top: 1.5pt solid #000; }' +
    '.edge-b { bottom: 0; left: 0; right: 0; height: 0; border-top: 1.5pt solid #000; }' +
    '.edge-l { top: 0; bottom: 0; left: 0; width: 0; border-left: 1.5pt solid #000; }' +
    '.edge-r { top: 0; bottom: 0; right: 0; width: 0; border-left: 1.5pt solid #000; }' +
    'table.items { width: 100%; border-collapse: collapse; margin-bottom: 6pt; }' +
    'table.items td { padding: 2pt 4pt; }' +
    'table.items td.label { width: 55%; }' +
    'table.items td.value { text-align: right; }' +
    'table.items tr.total td { border-top: 1.5pt solid #000; font-weight: 700; padding-top: 5pt; }' +
    '.info-row { display: table; width: 100%; margin-bottom: 4pt; }' +
    '.info-label { display: table-cell; width: 190px; color: #000; }' +
    '.info-value { display: table-cell; border-bottom: 0.75pt solid #000; padding-bottom: 1pt; }' +
    '.extenso { text-transform: uppercase; font-weight: 700; }' +
    '.address-box { border: 1pt solid #000; padding: 4pt 8pt; margin: 8pt 0 6pt; font-weight: 700; }' +
    '.period-row { margin-bottom: 4pt; }' +
    '.period-box { display: inline-block; border: 0.75pt solid #000; padding: 2pt 8pt; margin: 0 4pt; }' +
    '.pix-box { border: 0.75pt dashed #000; padding: 6pt 8pt; margin: 0 0 8pt; font-size: 10pt; }' +
    '.signature { margin-top: 14pt; text-align: center; }' +
    '.signature .line { border-top: 1pt solid #000; width: 180pt; margin: 0 auto 4pt; }' +
    '.cut { display: flex; align-items: center; gap: 8pt; margin: 4mm 0; font-size: 8pt; letter-spacing: 0.18em; text-transform: uppercase; color: #333; }' +
    '.cut::before, .cut::after { content: ""; flex: 1; border-top: 0.75pt dashed #333; }' +
    '.cut span { padding: 0 4pt; }';

  function buildPrintDocument() {
    return '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">' +
      '<title>Recibos de Aluguel</title><style>' + PRINT_CSS + '</style></head><body>' +
      '<div class="sheet">' +
      framedReceiptHTML(receipts[0]) +
      '<div class="cut"><span>cortar</span></div>' +
      framedReceiptHTML(receipts[1]) +
      '</div></body></html>';
  }

  function printSheet() {
    syncCurrent();
    var old = document.getElementById("printFrame");
    if (old) old.parentNode.removeChild(old);

    var iframe = document.createElement("iframe");
    iframe.id = "printFrame";
    iframe.setAttribute("aria-hidden", "true");
    iframe.style.cssText = "position:fixed;left:-10000px;top:0;width:210mm;height:297mm;border:0;";
    document.body.appendChild(iframe);

    var doc = iframe.contentDocument || iframe.contentWindow.document;
    doc.open();
    doc.write(buildPrintDocument());
    doc.close();

    function doPrint() {
      iframe.contentWindow.focus();
      iframe.contentWindow.print();
    }
    setTimeout(doPrint, 80);
  }

  $("generateBtn").addEventListener("click", printSheet);

  // ---- Init ----
  applyFormData(receipts[activeIndex]);
  updateTabUI();
  renderPreview();
})();
</script>
</body>
</html>
